name: Process release PDFs

on:
  release:
    types: [published, edited, prereleased]
  schedule:
    # release 자산 업로드가 이벤트를 못 띄우는 경우를 대비한 안전망
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 업로드 직후 dispatch·release 이벤트·cron이 겹쳐도 조각을 두 번 합치지 않게 한 번에 하나만.
concurrency:
  group: process-release
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pymupdf

      - name: Generate thumbnails / previews / catalog.json
        run: python scripts/generate_previews.py

      - name: Commit catalog.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || git commit -m "chore: update catalog.json"
          git push
